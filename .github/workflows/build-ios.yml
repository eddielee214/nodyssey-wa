# 放到你 fork 仓库的 .github/workflows/build-ios.yml
# 推送到 main 或在 Actions 页面手动 Run workflow，会编译出未签名的 .ipa，
# 在本次运行页面底部的 Artifacts 里下载。
name: Build unsigned iOS ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      # iOS 模块依赖的 KMP 模块也声明了 Android 目标，没有 Android SDK 会配置失败
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # Kotlin/Native 编译器很大，缓存起来第二次起会快很多
      - name: Cache the Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build the unsigned app
        env:
          # Release 版 Kotlin/Native 链接需要 5G 堆，否则 Java heap space
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx5g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"
        run: |
          xcodebuild \
            -project iosapp/Nodyssey.xcodeproj \
            -scheme Nodyssey \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Nodyssey.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$(sed -n 's/^nodyssey\.versionName=//p' gradle.properties | head -1)" \
            CURRENT_PROJECT_VERSION="$(sed -n 's/^nodyssey\.versionCode=//p' gradle.properties | head -1)"

      # ipa = 把 .app 放进 Payload/ 再 zip
      - name: Pack the .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/Nodyssey.xcarchive/Products/Applications/Nodyssey.app" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry nodyssey-unsigned.ipa Payload)
          ls -lh "$RUNNER_TEMP/nodyssey-unsigned.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: nodyssey-unsigned-ipa
          path: ${{ runner.temp }}/nodyssey-unsigned.ipa
